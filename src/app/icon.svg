<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">macOS Command Symbol</title>
  <desc id="desc">An ultra bold, authentic purple line-based icon of the macOS command key (looped square symbol).</desc>
  
  <path 
    d="M 45 70 
